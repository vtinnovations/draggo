# All Draggo routes live under /contao so they inherit the Contao backend
# firewall (authentication enforced by core). Mutations additionally validate
# REQUEST_TOKEN inside the controllers via RequestGuard.

# ── Licence management (Contao → Settings) ──────────────────────────
# The three controls in the "Draggo Licence management" section post here.
# Backend-scoped, so Contao's firewall authenticates before the controller
# runs; the controller then re-checks admin rights and REQUEST_TOKEN itself.
draggo_licence_activate:
    path: /contao/draggo/licence/activate
    controller: Vtinnovations\Draggo\Controller\Api\ActivationApiController::activate
    methods: [POST]
    defaults:
        _scope: backend

draggo_licence_refresh:
    path: /contao/draggo/licence/refresh
    controller: Vtinnovations\Draggo\Controller\Api\ActivationApiController::refresh
    methods: [POST]
    defaults:
        _scope: backend

draggo_licence_remove:
    path: /contao/draggo/licence/remove
    controller: Vtinnovations\Draggo\Controller\Api\ActivationApiController::remove
    methods: [POST]
    defaults:
        _scope: backend

# Server-initiated record push. Fixed by the registry protocol and therefore
# NOT backend-scoped: it carries no session and no browser CSRF token because
# it is server-to-server. It is authenticated cryptographically instead — see
# InboundExchange. GET is answered 405 (not 404) so a misconfiguration is
# distinguishable from a missing route.
draggo_licence_updater:
    path: /rest/api/v1/draggo-license-updater
    controller: Vtinnovations\Draggo\Controller\Api\ServiceHookController

